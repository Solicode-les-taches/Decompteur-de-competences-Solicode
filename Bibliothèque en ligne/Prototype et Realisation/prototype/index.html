<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Catalogue des livres</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>




  
  <header class="header">
    <h1>Catalogue de la bibliothèque</h1>
  </header>

  <main class="container">
    <form  class="searchbar">
      <input  type="search"  id="search"  placeholder="Rechercher un livre par titre ou auteur..."  class="search-input">
    </form>

    <div class="catalogue" id="catalogue"></div>

    <form id="form-ajout" class="form-ajout">
      <h2>Ajouter un livre</h2>

      <label for="code">Code :</label>
      <input type="number" id="code" name="code" required>

      <label for="titre">Titre :</label>
      <input type="text" id="titre" name="titre" required>

      <label for="auteur">Auteur :</label>
      <input type="text" id="auteur" name="auteur" required>

      <label for="editeur">Editeur :</label>
      <input type="text" id="editeur" name="editeur" required>


      <label for="annee">Année de parution :</label>
      <input type="number" id="annee" name="annee" required>

      <label for="prix">Prix (DH) :</label>
      <input type="number" id="prix" name="prix" required>

      <label for="disponible">Disponible :</label>
      <select id="disponible" name="disponible">
        <option value="true">Oui</option>
        <option value="false">Non</option>
      </select>

      <button type="submit" id="ajoute-livre" class="btn-primary">Ajouter le livre</button>
    </form>
  </main>

  <footer class="footer">
    <p>Total des livres : <span id="total-livres">0</span></p>
    <p>Livres disponibles : <span id="livres-disponibles">0</span></p>
  </footer>

  <script src="scripet.js"></script>
</body>
</html>
